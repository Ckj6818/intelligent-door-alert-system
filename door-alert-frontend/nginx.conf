server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 告警推送：/api/ws/alerts -> backend /ws/alerts
    location /api/ws/ {
        proxy_pass http://backend:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 告警抓拍图片
    location /uploads/ {
        proxy_pass http://backend:8081/uploads/;
        proxy_set_header Host $host;
    }

    # 边缘 YOLO MJPEG 同源代理（避免 HTTPS 页面直连 :8090 被 Mixed Content 拦截）
    # Docker Desktop：宿主机 AI；Compose full 可将 upstream 改为 ai-service:8090
    location /video-stream/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
